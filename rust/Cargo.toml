[package]
name = "rootree-core"
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Nucleo di RooTree: filesystem, operazioni, archivi, remoti"

[lib]
crate-type = ["staticlib", "rlib"]

# Fase 4: l'helper che gira da root, lanciato con devel-su dalla modalità root
[[bin]]
name = "rootree-helper"
path = "src/bin/rootree-helper.rs"

[dependencies]
cxx = "1.0"
libc = "0.2"
# solo i formati che le immagini Qt del runtime non leggono (WebP, TIFF, BMP)
image = { version = "0.25", default-features = false, features = ["webp", "tiff", "bmp"] }
# Fase 3: ricerca e archivi. Tutto Rust puro tranne zstd (C, compilato col
# cross-gcc); i RAR (e i formati rari) li legge libarchive di sistema, caricata
# a runtime con dlopen: nel target mancano gli header
regex = "1"
# il protocollo fra l'app e l'helper root: una riga JSON per messaggio
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fase 5: SFTP con libssh2 (compilata dal crate col cross-gcc, contro
# l'OpenSSL 3 di sistema: nel target c'è, libssh2 no)
ssh2 = "0.9"
# la cassaforte delle password: Argon2id + XChaCha20-Poly1305, Rust puro
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
quick-xml = "0.37"
# Fase 5 step 4: i cloud (Dropbox) su HTTPS, con l'OpenSSL di
# sistema (native-tls) come il resto; PKCE con SHA-256
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
sha2 = "0.10"
# Mega: il crate ufficioso (MIT/Apache-2.0) è asincrono
mega = "0.8"
reqwest = "0.12"
# Fase 5 step 5: FTP e FTPS. Il TLS lo fa un connettore nostro su OpenSSL (ftp.rs):
# serve il riuso della sessione sul canale dati e la fiducia al primo uso
suppaftp = { version = "12", default-features = false, features = ["secure", "deprecated"] }
openssl = "0.10"
# Fase 5 step 5: SMB 2/3 (Windows, Samba, NAS), Rust puro: firma, cifratura,
# NTLM, elenco delle condivisioni. Asincrono: gira sul runtime tokio come Mega
smb2 = "0.43"
# Fase 5 step 5: S3 e compatibili. La firma (SigV4) è scritta in s3.rs sopra
# ureq; servono solo HMAC-SHA256 e MD5 (DeleteObjects lo vuole), Rust puro
hmac = "0.12"
md-5 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
sluice = "0.5"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "zstd", "lzma", "xz"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
bzip2 = "0.6"
zstd = "0.14"
lzma-rust2 = { version = "0.25", features = ["xz"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress", "bzip2", "ppmd", "deflate", "zstd"] }

[build-dependencies]
cxx-build = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
