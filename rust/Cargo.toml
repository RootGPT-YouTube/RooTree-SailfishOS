[package]
name = "rootree-core"
version = "0.3.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Nucleo di RooTree: filesystem, operazioni, archivi, remoti"

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1.0"
libc = "0.2"
# solo i formati che le immagini Qt del runtime non leggono (WebP, TIFF, BMP)
image = { version = "0.25", default-features = false, features = ["webp", "tiff", "bmp"] }

[build-dependencies]
cxx-build = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
